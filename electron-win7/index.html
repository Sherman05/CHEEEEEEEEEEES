<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; img-src 'self' data: blob:;" />
    <title>GI chess-T1</title>
    <style>
      /* Window drag regions — Electron uses -webkit-app-region in frameless windows.
         Reuse the Tauri data attribute so JSX doesn't need to change. */
      html, body, #root { height: 100%; margin: 0; }
      [data-tauri-drag-region] { -webkit-app-region: drag; }
      button, input, a, [data-tauri-drag-region] button { -webkit-app-region: no-drag; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
