<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 100">
  <!-- Scout Black: Triangular top, EMPTY inside (0 lines), SMALLEST, trapezoidal body -->
  <!-- Triangular top (head) -->
  <path d="M 38,20 L 32,36 L 58,36 L 52,20 Z"
        fill="#000000" stroke="#411b1a" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Trapezoidal body (smallest piece) -->
  <path d="M 26,88 L 20,52 L 20,38 L 70,38 L 70,52 L 64,88 Z"
        fill="#000000" stroke="#411b1a" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- NO vertical lines — Scout is empty inside -->
</svg>
