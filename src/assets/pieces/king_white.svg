<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 100">
  <!-- King White: Triangular top WITH window (hole), tower body, 1 long + 1 short line -->
  <!-- Triangular top with window -->
  <path d="M 36,8 L 28,28 L 62,28 L 54,8 Z"
        fill="#ffffff" stroke="#0a0a0a" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Window (hole) in the triangular top -->
  <path d="M 41,13 L 38,22 L 52,22 L 49,13 Z"
        fill="#808080" stroke="#0a0a0a" stroke-width="1.5"
        stroke-linejoin="round"/>
  <!-- Tower body -->
  <path d="M 22,88 L 14,48 L 14,30 L 76,30 L 76,48 L 68,88 Z"
        fill="#ffffff" stroke="#0a0a0a" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left vertical line (long) -->
  <line x1="40" y1="40" x2="40" y2="82"
        stroke="#000000" stroke-width="3.5" stroke-linecap="butt"/>
  <!-- Right vertical line (short) -->
  <line x1="52" y1="40" x2="52" y2="62"
        stroke="#000000" stroke-width="3.5" stroke-linecap="butt"/>
</svg>
