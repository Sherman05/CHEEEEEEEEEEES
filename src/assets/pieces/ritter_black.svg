<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 100">
  <!-- Ritter Black: Triangular top + tower body + 2 parallel vertical lines -->
  <!-- Triangular top (head) -->
  <path d="M 36,12 L 28,32 L 62,32 L 54,12 Z"
        fill="#000000" stroke="#411b1a" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Tower body -->
  <path d="M 22,88 L 14,48 L 14,32 L 76,32 L 76,48 L 68,88 Z"
        fill="#000000" stroke="#411b1a" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left vertical line (full height) -->
  <line x1="39" y1="42" x2="39" y2="82"
        stroke="#fffef7" stroke-width="3.5" stroke-linecap="butt"/>
  <!-- Right vertical line (full height, parallel, separate) -->
  <line x1="53" y1="42" x2="53" y2="82"
        stroke="#fffef7" stroke-width="3.5" stroke-linecap="butt"/>
</svg>
