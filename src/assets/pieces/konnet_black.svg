<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 100">
  <!-- Konnet Black: OVAL top, tower body, 3 long lines, BIGGEST piece -->
  <!-- Oval top (navershie) -->
  <ellipse cx="45" cy="22" rx="22" ry="14"
        fill="#000000" stroke="#411b1a" stroke-width="3"/>
  <!-- Tower body (biggest) -->
  <path d="M 18,90 L 8,50 L 8,34 L 82,34 L 82,50 L 72,90 Z"
        fill="#000000" stroke="#411b1a" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left vertical line (long) -->
  <line x1="33" y1="44" x2="33" y2="84"
        stroke="#fffef7" stroke-width="3.5" stroke-linecap="butt"/>
  <!-- Center vertical line (long) -->
  <line x1="45" y1="44" x2="45" y2="84"
        stroke="#fffef7" stroke-width="3.5" stroke-linecap="butt"/>
  <!-- Right vertical line (long) -->
  <line x1="57" y1="44" x2="57" y2="84"
        stroke="#fffef7" stroke-width="3.5" stroke-linecap="butt"/>
</svg>
