<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 100">
  <!-- Prince Black: OVAL top, tower body, 1 long + 1 short line -->
  <!-- Oval top (navershie) -->
  <ellipse cx="45" cy="22" rx="18" ry="12"
        fill="#000000" stroke="#411b1a" stroke-width="3"/>
  <!-- Tower body -->
  <path d="M 22,88 L 14,48 L 14,32 L 76,32 L 76,48 L 68,88 Z"
        fill="#000000" stroke="#411b1a" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left vertical line (long) -->
  <line x1="40" y1="42" x2="40" y2="82"
        stroke="#fffef7" stroke-width="3.5" stroke-linecap="butt"/>
  <!-- Right vertical line (short) -->
  <line x1="52" y1="42" x2="52" y2="62"
        stroke="#fffef7" stroke-width="3.5" stroke-linecap="butt"/>
</svg>
